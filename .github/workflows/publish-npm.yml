# Publishes to https://www.npmjs.com/package/olostep
#
# Setup (one time):
#   - Repo → Settings → Secrets → Actions: add NPM_TOKEN
#     (npmjs.com → Access Tokens → Granular or Automation, with publish for package "olostep")
#
# Release:
#   1. Bump "version" in package.json on main (must match the tag, without the "v")
#   2. git tag vx.x.x&& git push origin vx.x.x
#   Or: Actions → "Publish to npm" → Run workflow (after version bump is on the branch you run from)

name: Publish to npm

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # npm ci installs exactly what's in package-lock.json (commit the lockfile when deps change).
      - run: npm ci

      - run: npm run check:types

      # Live API tests gate the release. Runs when OLOSTEP_API_KEY is set;
      # warns and continues if the secret is missing so a release is never
      # silently blocked by a config gap.
      - name: Live API tests
        env:
          OLOSTEP_API_KEY: ${{ secrets.OLOSTEP_API_KEY }}
        run: |
          if [ -z "$OLOSTEP_API_KEY" ]; then
            echo "::warning::OLOSTEP_API_KEY not set - publishing without the live test gate"
          else
            npm test
          fi

      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
